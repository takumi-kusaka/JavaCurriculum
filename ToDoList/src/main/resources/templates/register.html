<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザー登録</title>

<style>

body{
    background:#f5f5f5;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:300px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:5px;
    background:#34a853;
    color:white;
    font-size:14px;
    cursor:pointer;
}

a{
    font-size:12px;
    color:#4285f4;
}

</style>

</head>
<body>

<div class="container">

<h1>ユーザー登録</h1>

<form action="/register" method="post">

    <div>
        <label>ユーザー名</label><br>
        <input type="text" name="username">
    </div>

    <div>
        <label>パスワード</label><br>
        <input type="password" name="password">
    </div>

    <button type="submit">登録</button>

</form>

<p>
    <a href="/">TOPへ戻る</a>
</p>

</div>

</body>
</html>
