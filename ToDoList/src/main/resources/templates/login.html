<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>

<style>
	body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    width:300px;
    padding:30px 40px;
    border-radius:8px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
    text-align:center;
}

h1{
    margin-bottom:30px;
}

.form-group{
    text-align:left;
    margin-bottom:15px;
}

label{
    display:block;
    font-size:12px;
    margin-bottom:5px;
}

input{
    width:100%;
    height:35px;
    padding:0 10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    height:40px;
    border:none;
    border-radius:5px;
    background-color:#4285f4;
    color:white;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
}

.link{
    margin-top:15px;
    font-size:12px;
}

.link a{
    color:#4285f4;
    text-decoration:none;
}

.error{
    color:red;
    font-size:13px;
    margin-bottom:15px;
}
</style>

</head>
<div class="container">
    <h1>ログイン</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>

    <form action="/login" method="post">

        <div class="form-group">
            <label>ユーザー名</label>
            <input type="text" name="username">
        </div>

        <div class="form-group">
            <label>パスワード</label>
            <input type="password" name="password">
        </div>

        <button type="submit">ログイン</button>

    </form>

    <p class="link">
        <a href="/register">ユーザー登録はこちら</a>
    </p>
</div>

</body>
</html>
